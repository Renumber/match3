<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#141414" />
    <title>Match3</title>
  </head>
  <body>
    <div id="app">
      <div id="hud">
        <div class="boss-row">
          <span id="boss-name">골렘</span>
          <em id="boss-phase" class="boss-phase" hidden>후반</em>
          <div id="boss-bar" class="boss-bar" aria-hidden="true">
            <i id="boss-fill-late" class="boss-fill boss-fill-late"></i>
            <i id="boss-fill-early" class="boss-fill boss-fill-early"></i>
            <div id="boss-ticks" class="boss-ticks"></div>
          </div>
        </div>
        <div class="hud-row">
          <div class="stat">
            <span>MOVES</span>
            <strong id="moves">40</strong>
          </div>
          <div class="stat">
            <span>LEVEL</span>
            <strong id="level">1</strong>
          </div>
          <div class="stat">
            <span>CHAIN</span>
            <strong id="chain">0</strong>
          </div>
          <div class="stat">
            <span>CLEARED</span>
            <strong id="cleared">0</strong>
          </div>
          <div class="hud-end">
            <p class="hint">스와이프하거나 인접 칸을 두 번 눌러 스왑</p>
            <div class="hud-actions">
              <button type="button" id="codex-open">도감</button>
              <button type="button" id="codex-stats">상태</button>
            </div>
          </div>
        </div>
        <div class="xp-row">
          <span>XP</span>
          <div class="xp-bar" aria-hidden="true">
            <i id="xp-fill"></i>
          </div>
          <strong id="xp-label">0/20</strong>
        </div>
      </div>
      <div id="stage"></div>
    </div>
    <div id="levelup" class="hidden" aria-hidden="true">
      <div class="levelup-panel">
        <h2>LEVEL UP</h2>
        <p>능력을 하나 고르세요</p>
        <div id="levelup-cards" class="levelup-cards"></div>
      </div>
    </div>
    <div id="codex" class="hidden" aria-hidden="true">
      <div class="codex-panel" role="dialog" aria-labelledby="codex-title">
        <div class="codex-top">
          <h2 id="codex-title">도감</h2>
          <div class="codex-tabs">
            <button type="button" data-codex-tab="cards" class="active">카드</button>
            <button type="button" data-codex-tab="run">상태</button>
          </div>
          <button type="button" id="codex-close">닫기</button>
        </div>
        <div id="codex-cards" class="codex-cards"></div>
        <div id="codex-run" class="codex-run hidden"></div>
      </div>
    </div>
    <div id="result" class="hidden" aria-hidden="true">
      <div class="result-panel">
        <p id="result-kicker"></p>
        <h2 id="result-title"></h2>
        <p id="result-detail"></p>
        <button type="button" id="result-retry">다시</button>
      </div>
    </div>
    <p id="build-version" class="build-version"></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
